name: Build Army2.5.0 iOS

on:
  workflow_dispatch:
    inputs:
      loai:
        description: "thuong = IPA chua ky (eSign, Scarlet, AltStore, Sideloadly); trollstore = .tipa co JIT"
        type: choice
        options: [thuong, trollstore, ca-hai]
        default: ca-hai
  push:
    branches: [main]
    paths-ignore:
      - 'native/**'
      - '.github/workflows/build-native.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Chon Xcode moi nhat
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Dung $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          command -v rg >/dev/null || brew install ripgrep

      - name: Build IPA thuong
        if: ${{ github.event_name == 'push' || inputs.loai == 'thuong' || inputs.loai == 'ca-hai' }}
        run: |
          set -o pipefail
          xcodebuild -project phoneME.xcodeproj -scheme phoneME -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath .build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build-thuong.log | grep -E "error:|\*\* BUILD" || true
          test "${PIPESTATUS[0]}" = "0"
          APP=$(find .build/device/Build/Products -type d -path '*-iphoneos/phoneME.app' | head -1)
          test -n "$APP"
          test -f "$APP/Army250.jar"
          rm -rf out && mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry ../Army250.ipa Payload)
          ls -la Army250.ipa

      - name: Build TrollStore (.tipa)
        if: ${{ github.event_name == 'push' || inputs.loai == 'trollstore' || inputs.loai == 'ca-hai' }}
        run: |
          brew install ldid
          bash Scripts/build-trollstore-tipa.sh --output "$PWD/Army250-TrollStore.tipa" \
            --derived-data "$PWD/.build/trollstore" 2>&1 | tail -40

      - name: Day IPA va log len nhanh ban-build
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          for f in Army250.ipa Army250-TrollStore.tipa; do [ -f "$f" ] && cp "$f" /tmp/pub/; done
          for f in build-thuong.log Artifacts/*.log; do
            [ -f "$f" ] || continue
            grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)|\*\* " "$f" | tail -200 > "/tmp/pub/$(basename "$f" .log)-loi.txt" || true
            tail -400 "$f" > "/tmp/pub/$(basename "$f" .log)-cuoi.txt"
          done
          echo "run ${GITHUB_RUN_NUMBER} sha ${GITHUB_SHA} status ${{ job.status }}" > /tmp/pub/KET_QUA.txt
          cd /tmp/pub
          git init -q -b ban-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}) ${{ job.status }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ban-build

      - name: Tao Release de tai IPA
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=""
          for f in Army250.ipa Army250-TrollStore.tipa; do [ -f "$f" ] && FILES="$FILES $f"; done
          gh release delete ios-moi-nhat -y --cleanup-tag || true
          gh release create ios-moi-nhat $FILES --title "Army2.5.0 iOS - build ${GITHUB_RUN_NUMBER}" \
            --notes "IPA chua ky: ky bang eSign, Scarlet, AltStore hoac Sideloadly. File .tipa (neu co): cai bang TrollStore." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Army250-iOS
          path: |
            Army250.ipa
            Army250-TrollStore.tipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            build-thuong.log
            Artifacts/*.log
          if-no-files-found: ignore
