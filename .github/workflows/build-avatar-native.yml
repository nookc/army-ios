name: Build Avatar iOS + Android (thuan)

# Ban "thuan" cua client Avatar 2.5.8 (Ban Ca 3D): ma Java cua client duoc dich san sang C -> ma may
# (ARM64 tren iPhone; arm64-v8a / armeabi-v7a / x86_64 tren Android). KHONG chay qua gia lap / bo thong dich.
# Ket qua: nhanh "avatar-thuan-build" (IPA, APK chua ky, anh chup kiem thu) + release "avatar-thuan-moi-nhat" (IPA).
on:
  workflow_dispatch:
  push:
    branches: [avatar-ios, avatar-hd]
    paths:
      - 'native/**'
      - 'Bundled/Avatar258.jar'
      - 'Bundled/server.txt'
      - '.github/workflows/build-avatar-native.yml'

permissions:
  contents: write

concurrency:
  group: avatar-thuan-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Chon Xcode moi nhat
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Dung $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dich client + build IPA va ban Simulator
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash native/tools/build_avatar_ios.sh ca-hai 2>&1 | tee build-ios.log

      - name: Chay thu tren iOS Simulator (cai dat, dang nhap, ket noi may chu gia)
        continue-on-error: true
        run: |
          bash native/tools/avatar_sim_test.sh 2>&1 | tee sim-test.log

      - name: Gom ket qua
        if: always()
        run: |
          mkdir -p out/ios/test
          [ -f native/build/avatar-ios/Avatar-Thuan.ipa ] && cp native/build/avatar-ios/Avatar-Thuan.ipa out/ios/
          [ -f native/build/avatar-ios/AvatarHD-Thuan.ipa ] && cp native/build/avatar-ios/AvatarHD-Thuan.ipa out/ios/
          cp native/build/avatar-ios/test/* out/ios/test/ 2>/dev/null || true
          for f in build-ios.log sim-test.log; do [ -f "$f" ] && tail -600 "$f" > "out/ios/$f"; done
          [ -f native/build/gen-avatar/stats.txt ] && cp native/build/gen-avatar/stats.txt out/ios/
          echo "ios: ${{ job.status }}" > out/ios/KET_QUA.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-thuan-ios
          path: out/ios
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dich client + build APK (arm64-v8a, armeabi-v7a, x86_64)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash native/tools/build_avatar_android.sh 2>&1 | tee build-android.log

      - name: Bat KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Chay thu tren Android emulator (cai dat, dang nhap, ket noi may chu gia)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash native/tools/avatar_android_test.sh

      - name: Gom ket qua
        if: always()
        run: |
          mkdir -p out/android/test
          cp native/build/avatar-android/Avatar-unsigned.apk native/build/avatar-android/Avatar-test.apk out/android/ 2>/dev/null || true
          cp native/build/avatar-android/AvatarHD-unsigned.apk out/android/ 2>/dev/null || true
          cp native/build/avatar-android/libavatar-*-debug.so out/android/ 2>/dev/null || true
          cp -r native/build/avatar-android/test/* out/android/test/ 2>/dev/null || true
          [ -f build-android.log ] && tail -400 build-android.log > out/android/build-android.log
          [ -f native/build/avatar-android/gen/stats.txt ] && cp native/build/avatar-android/gen/stats.txt out/android/
          echo "android: ${{ job.status }}" > out/android/KET_QUA.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-thuan-android
          path: out/android
          if-no-files-found: warn

  publish:
    needs: [ios, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Day len nhanh avatar-thuan-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          [ -d dl/avatar-thuan-ios ] && cp -r dl/avatar-thuan-ios /tmp/pub/ios
          [ -d dl/avatar-thuan-android ] && cp -r dl/avatar-thuan-android /tmp/pub/android
          echo "run ${GITHUB_RUN_NUMBER} sha ${GITHUB_SHA} ios ${{ needs.ios.result }} android ${{ needs.android.result }}" > /tmp/pub/KET_QUA.txt
          cd /tmp/pub
          # nhanh avatar-ios (ban phat hanh) -> avatar-thuan-build nhu cu; nhanh khac (vd avatar-hd dang lam) -> <nhanh>-build,
          # KHONG ghi de ket qua cua ban phat hanh
          DICH=avatar-thuan-build
          [ "${GITHUB_REF_NAME}" = "avatar-ios" ] || DICH="${GITHUB_REF_NAME}-build"
          git init -q -b "$DICH"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Avatar thuan ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}) ios ${{ needs.ios.result }} android ${{ needs.android.result }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DICH"

      - name: Release (IPA) de tai tren dien thoai
        if: needs.ios.result == 'success' && github.ref_name == 'avatar-ios'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f dl/avatar-thuan-ios/Avatar-Thuan.ipa ] || exit 0
          cp dl/avatar-thuan-ios/Avatar-Thuan.ipa .
          gh release delete avatar-thuan-moi-nhat -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create avatar-thuan-moi-nhat Avatar-Thuan.ipa -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Avatar iOS thuan (ma may) - build ${GITHUB_RUN_NUMBER}" \
            --notes "Ban iOS thuan: client Avatar dich san sang ma may ARM64, khong chay qua gia lap. IPA chua ky: ky bang eSign, Scarlet, AltStore, Sideloadly hoac TrollStore. Lan dau mo app nhap dia chi may chu (giu nut Aa 1 giay de doi lai)."
