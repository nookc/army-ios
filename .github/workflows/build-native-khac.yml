name: Build Army2.5.0 Android + Windows (thuan)

# APK Android va EXE Windows "thuan": cung bo dich san client J2ME -> C -> ma may nhu ban iOS (khong gia lap).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'Bundled/Army250.jar'
      - '.github/workflows/build-native-khac.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dich client + build APK (arm64-v8a, armeabi-v7a, x86_64)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash native/tools/build_android.sh 2>&1 | tee build-android.log

      - name: Bat KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Chay thu tren Android emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash native/tools/android_ci_test.sh

      - name: Day APK, anh chup, log len nhanh ban-build-android
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub/test
          cp native/build/android/*.apk /tmp/pub/ 2>/dev/null || true
          cp native/build/android/libarmy2-*-debug.so /tmp/pub/ 2>/dev/null || true
          cp -r native/build/android/test/* /tmp/pub/test/ 2>/dev/null || true
          [ -f build-android.log ] && tail -400 build-android.log > /tmp/pub/build-android.log
          [ -f native/build/android/gen/stats.txt ] && cp native/build/android/gen/stats.txt /tmp/pub/
          echo "run ${GITHUB_RUN_NUMBER} sha ${GITHUB_SHA} status ${{ job.status }}" > /tmp/pub/KET_QUA.txt
          cd /tmp/pub
          git init -q -b ban-build-android
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build android ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}) ${{ job.status }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ban-build-android

  windows-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai MinGW-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q mingw-w64

      - name: Dich client + build EXE (Windows x86-64)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash native/tools/build_win.sh 2>&1 | tee build-win.log

      - uses: actions/upload-artifact@v4
        with:
          name: Army250-Windows
          path: |
            native/build/win/Army250.exe
            native/build/win/Army250-debug.exe
            build-win.log

  windows-test:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Army250-Windows
          path: dl

      - name: Chay thu tren Windows that (che do tu kiem thu)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test, test\du_lieu | Out-Null
          $exe = (Get-ChildItem -Recurse dl -Filter Army250.exe | Select-Object -First 1).FullName
          Set-Content -Path test\lenh.txt -Value "" -Encoding ascii
          $p = Start-Process -FilePath $exe -ArgumentList "--lenh", "$PWD\test\lenh.txt", "--ra", "$PWD\test", "--du-lieu", "$PWD\test\du_lieu" -PassThru -RedirectStandardError test\stderr.txt
          $cmds = @("sleep 7000", "shot t1_cauhinh", "key -5", "sleep 3000", "shot t2_amthanh", "key -6", "sleep 5000", "shot t3_gioithieu", "key -7", "sleep 5000", "shot t4_dangnhap", "tap 188 276", "sleep 1500", "text:tbot6", "sleep 1500", "shot t5_da_nhap_ten", "sleep 10000", "shot t6_10giay")
          foreach ($c in $cmds) { Add-Content -Path test\lenh.txt -Value $c -Encoding ascii }
          Start-Sleep -Seconds 50
          $p.Refresh()
          if ($p.HasExited) { "APP DA THOAT, ma $($p.ExitCode)" | Set-Content test\trang_thai_app.txt } else { "app con chay; RAM $([int]($p.WorkingSet64/1MB)) MB; CPU $([int]$p.TotalProcessorTime.TotalSeconds) s" | Set-Content test\trang_thai_app.txt; Stop-Process -Id $p.Id -Force }
          Copy-Item test\du_lieu\log.txt test\log_app.txt -ErrorAction SilentlyContinue
          Copy-Item test\du_lieu\crash.txt test\crash_app.txt -ErrorAction SilentlyContinue
          Get-ChildItem test

      - name: Day EXE + ket qua len nhanh ban-build-windows
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf pub && mkdir -p pub/test
          find dl -name '*.exe' -exec cp {} pub/ \;
          find dl -name 'build-win.log' -exec sh -c 'tail -300 "$1" > pub/build-win.log' _ {} \;
          cp test/* pub/test/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_NUMBER} sha ${GITHUB_SHA} status ${{ job.status }}" > pub/KET_QUA.txt
          cd pub
          git init -q -b ban-build-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build windows ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}) ${{ job.status }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ban-build-windows
