name: Kiem tra APK da ky (Android 6 / 11 / 14)

# Cai APK phat hanh (ky bang khoa rieng, ngoai CI) len emulator nhieu doi Android va chay thu bang thao tac that.
on:
  push:
    branches: [kiem-tra-apk]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            target: default
          - api: 30
            target: default
          - api: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - name: Bat KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Chay thu APK da ky tren Android API ${{ matrix.api }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: APK=ky/Army2Coffee.apk bash native/tools/android_ci_test.sh

      - name: Day ket qua len nhanh kq-apk-ky-${{ matrix.api }}
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp -r native/build/android/test/* /tmp/pub/ 2>/dev/null || true
          echo "api ${{ matrix.api }} run ${GITHUB_RUN_NUMBER} sha ${GITHUB_SHA} status ${{ job.status }}" > /tmp/pub/KET_QUA.txt
          cd /tmp/pub
          git init -q -b kq-apk-ky-${{ matrix.api }}
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Kiem tra APK da ky API ${{ matrix.api }} ${{ job.status }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" kq-apk-ky-${{ matrix.api }}
